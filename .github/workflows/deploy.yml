name: Deploy Laravel 12 Directly to Subdomain Root

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CPANEL_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.CPANEL_PORT }} -H ${{ secrets.CPANEL_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy project
        run: |
          ssh -p ${{ secrets.CPANEL_PORT }} ${{ secrets.CPANEL_USERNAME }}@${{ secrets.CPANEL_HOST }} << EOF
            set -e
            cd /home/${{ secrets.CPANEL_USERNAME }}/public_html/admin.falcondrive.ae

            php artisan down || true
            git pull origin main
            php artisan config:clear
            php artisan cache:clear
            php artisan route:clear
            php artisan view:clear
            chmod -R 775 storage bootstrap/cache
            php artisan up || true
          EOF